# Le répertoire, par familles.
#
# Volontairement NON exhaustif : une liste complète date, elle ennuie, et elle
# prive l'organisateur d'une raison d'écrire. Quelques titres par famille
# suffisent à situer le niveau et la couleur.
#
# `brouillon: true` = emplacement à remplir. Retirer la ligne une fois le
# vrai titre saisi. Plus aucun aujourd'hui : les trois familles affichées ne
# contiennent que de vrais titres.
#
# Deux familles sont gardées en commentaire en bas de fichier, le temps
# d'arbitrer si elles ont leur place : « Pop & contemporain » et « Autres ».
# Les décommenter suffit à les faire apparaître.

- id: films
  ordre: 1
  famille: Musiques de films
  titres:
    - { titre: Le voyage de Chihiro, formation: quatuor-a-une-barbe }
    - { titre: Les Aristochats, formation: katr-tet }
    - { titre: Gladiator, formation: quatuor-a-une-barbe }
    - { titre: Le bossu de Notre-Dame, formation: katr-tet }
    # - { titre: Toy Story, formation: katr-tet }

- id: barbershop
  ordre: 2
  famille: Barbershop & standards
  titres:
    - { titre: Smile, formation: katr-tet }
    - { titre: When I Sing, formation: katr-tet }
    - { titre: Five Minutes More, formation: katr-tet }
    - { titre: Fluffy Ruffle Days, formation: katr-tet }

- id: sacre
  ordre: 3
  famille: Classique & sacré
  titres:
    - { titre: Evening Rise, formation: 4plus4 }
    - { titre: Coventry Carol, formation: 4plus4 }
    - { titre: Quatre Petites Prières de saint François d’Assise, formation: katr-tet }
    - { titre: Gaudete Christus est Natus, formation: 4plus4 }

