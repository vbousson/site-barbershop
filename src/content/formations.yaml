# Les trois formations programmables.
#
# Le gabarit est volontairement contraint : même longueur de résumé, deux
# puces chacune. L'égalité entre les trois formations ne se décrète pas,
# elle s'impose par la typographie.
#
# `notation` peut être vide : sept parties ne sont pas un SATB, la notation
# n'aurait aucun sens pour la formation à sept.
#
# `id` doit correspondre à une entrée de src/data/formations.ts.

- id: katr-tet
  ordre: 1
  nom: Katr Tet
  registre: voix graves
  notation: TTBB
  effectif: 4
  accroche: "Ténor, lead, baryton, basse : le quatuor par lequel tout a commencé."
  resume: >-
    Ténor, lead, baryton, basse. Le barbershop se joue sur des accords très
    serrés, où le moindre écart s'entend tout de suite. C'est exigeant, et
    c'est précisément ce qui plaît.
  puces:
    - Barbershop, musiques de films, standards
    - Tient dans une cour, une église, une salle des fêtes
  detail:
    - >-
      Quatre chanteurs qui se déplacent sans matériel et chantent là où il y a
      un mur pour renvoyer le son.
    - >-
      Le répertoire est d'abord celui du barbershop : accords serrés, septièmes
      partout, tags qu'on tient jusqu'à ce que ça sonne. Il s'est élargi depuis
      aux musiques de films, aux standards et au sacré.
  photo: katr-tet-chenoise
  photoAttendue: photo de Katr Tet

- id: quatuor-a-une-barbe
  ordre: 2
  nom: Quatuor à une barbe
  registre: voix aiguës
  notation: SSAA
  effectif: 4
  accroche: Quatre voix aiguës, et une seule barbe.
  resume: >-
    Naïs, Mathilde et Aurore, plus Maurin sur la ligne d'alto. Le quatuor s'est
    monté autour du répertoire écrit pour voix aiguës : du sacré, du classique,
    de la chanson. Le nom, lui, se lit tout seul.
  puces:
    - Classique, sacré, chanson
    - Souvent glissé dans un concert à sept
  detail:
    - >-
      Beaucoup de pièces sont écrites pour des voix hautes et ne se transposent
      pas sans y perdre. Ce quatuor s'est monté pour aller les chanter là où
      elles sont écrites.
    - >-
      Maurin y tient la ligne d'alto. Ce n'est donc pas un quatuor féminin, et
      le nom le dit sans détour.
  photo: null
  photoAttendue: photo du Quatuor à une barbe

- id: 4plus4
  ordre: 3
  nom: 4+4=7
  registre: voix mixtes
  notation: null
  effectif: 7
  accroche: Les deux quatuors réunis, du grave à l'aigu.
  resume: >-
    Quatre plus quatre font sept parce que Maurin chante dans les deux. Le
    concert passe des voix graves aux voix aiguës, puis réunit tout le monde
    sur des pièces à sept parties.
  puces:
    - Le répertoire le plus large des trois
    - Du grave à l'aigu dans le même concert
  detail:
    - >-
      Quatre plus quatre font sept : Maurin chante dans les deux quatuors.
      C'est l'arithmétique du nom, et c'est aussi le plan du concert.
    - >-
      On alterne les pièces graves, les pièces aiguës, puis les tutti à sept.
      C'est la configuration où le répertoire est le plus large, et celle qui
      demande le plus de répétitions.
  photo: 4plus4-chenoise
  photoAttendue: photo de 4+4=7
