# Les trois formations programmables.
#
# Le gabarit est volontairement contraint : même longueur de résumé, deux
# puces chacune. L'égalité entre les trois formations ne se décrète pas,
# elle s'impose par la typographie.
#
# `id` doit correspondre à une entrée de src/data/formations.ts.

- id: katr-tet
  ordre: 1
  nom: Katr Tet
  registre: voix graves
  notation: TTBB
  effectif: 4
  accroche: Le quatuor barbershop d'origine, quatre voix graves.
  resume: >-
    Le quatuor d'origine, formé il y a sept ans autour du répertoire
    barbershop : ténor, lead, baryton, basse. Accords serrés, arrangements
    resserrés, humour de scène.
  puces:
    - Barbershop, musiques de films, standards
    - La formule la plus mobile
  detail:
    - >-
      Quatre chanteurs, quatre parties, aucun doublage. C'est la formule
      d'origine et la plus mobile : elle tient dans une cour, une église, une
      salle des fêtes, et se déplace sans matériel.
    - >-
      Le répertoire est celui du barbershop — accords serrés, septièmes
      partout, tags tenus — élargi aux musiques de films et aux standards.
      L'humour de scène fait partie du programme.
  photo: katr-tet-chenoise
  photoAttendue: photo — Katr Tet

- id: quartet-a-une-barbe
  ordre: 2
  nom: Le Quartet à une barbe
  registre: voix aiguës
  notation: SSAA
  effectif: 4
  accroche: Trois chanteuses et un ténor, quatre voix aiguës.
  resume: >-
    Trois chanteuses et le ténor du quatuor de voix graves, qui tient la ligne
    d'alto. Monté pour ouvrir le répertoire aux pièces écrites pour voix
    aiguës — d'où la barbe unique.
  puces:
    - Classique, sacré, chanson
    - Programmé au sein des concerts à sept
  detail:
    - >-
      Le second quatuor est né du besoin d'aller chercher un répertoire que
      quatre voix graves ne peuvent pas servir : les pièces écrites pour voix
      aiguës, du sacré au classique en passant par la chanson.
    - >-
      Maurin y tient la ligne d'alto. Ce n'est donc pas un quatuor féminin,
      et le nom le dit : une seule barbe pour quatre voix.
  photo: null
  photoAttendue: photo — Le Quartet à une barbe

- id: 4plus4
  ordre: 3
  nom: 4+4=7
  registre: voix mixtes
  notation: SATB
  effectif: 7
  accroche: Les deux quatuors réunis, sept voix mixtes.
  resume: >-
    Les deux quatuors réunis. Quatre plus quatre font sept parce que le ténor
    chante dans les deux. Le concert alterne pièces graves, pièces aiguës et
    tutti à sept parties.
  puces:
    - Le programme le plus large
    - La formule de concert complète
  detail:
    - >-
      Quatre plus quatre font sept : Maurin chante dans les deux quatuors.
      C'est l'arithmétique du nom, et c'est aussi la structure du concert.
    - >-
      Le programme alterne les pièces à voix graves, les pièces à voix aiguës
      et les tutti à sept parties. C'est la formule la plus complète, et celle
      qui montre le principe du groupe : sept chanteurs, sept parties,
      personne ne double personne.
  photo: 4plus4-chenoise
  photoAttendue: photo — 4+4=7
