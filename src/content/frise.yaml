# La frise.
#
# `aConfirmer: true` = millésime encore reconstruit à partir du récit oral
# (cf. BRIEF §7). Les trois premiers sont dans ce cas ; les suivants ont été
# confirmés par le groupe.

- id: depart
  annee: 2018
  aConfirmer: true
  titre: Quatre chanteurs, quatre voix
  texte: >-
    Le pari de départ : une voix par partie, sur le répertoire barbershop.
    Pur amateurisme, répétitions très irrégulières.

- id: interruption
  annee: 2020
  aConfirmer: true
  titre: Interruption
  texte: >-
    Le covid arrête tout. La reprise se fera à effectif remanié, avec
    l'arrivée d'un nouveau lead.

- id: regularite
  annee: 2022
  aConfirmer: true
  titre: La régularité
  texte: >-
    Adrien arrive au lead. C'est là que le groupe se met à répéter pour de bon,
    et plus seulement quand tout le monde est libre en même temps.

- id: nom-et-scene
  annee: 2023
  titre: Un nom et une scène
  texte: >-
    Premier concert au Depsival. Il fallait un nom pour l'affiche : ce sera
    Katr Tet. C'est aussi l'année où on arrive à tenir une heure de musique.

- id: second-quatuor
  annee: 2024
  cle: true
  titre: Le second quatuor
  texte: >-
    Maurin, qui chante aussi l'alto en chœur mixte, embarque Naïs, Mathilde et
    Léa sur des pièces à voix aiguës. Il tient les deux quatuors à la fois :
    quatre plus quatre font sept.

- id: relais-alto
  annee: 2025
  titre: Passage de relais
  texte: >-
    Léa passe la main à Aurore sur la ligne d'alto. Même répertoire, une
    couleur de voix différente, et tout un équilibre à retrouver.

- id: identite
  annee: 2026
  titre: Identité et structure
  texte: >-
    Mathilde dessine les logos et les visuels. Une association est en cours de
    constitution, pour facturer, déclarer à la Sacem, et porter les formations
    à venir.
