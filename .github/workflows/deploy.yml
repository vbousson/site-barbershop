name: Vérifier, construire, déployer

# Chaque poussée et chaque pull request : `astro check` puis `astro build`.
# Le déploiement dépend de la variable de dépôt HEBERGEUR (Settings > Secrets
# and variables > Actions > Variables) :
#
#  - absente (ou HEBERGEUR=pages) : sur main seulement, publication sur
#    GitHub Pages, https://vbousson.github.io/site-barbershop/, le temps que
#    le domaine soit branché.
#  - HEBERGEUR=ovh : sur main seulement, envoi de dist/ en SFTP sur
#    l'hébergement gratuit OVH, par tools/deploy-sftp.sh. Secret attendu :
#    OVH_SFTP_PASSWORD. Pas de prévisualisation des pull requests :
#    l'hébergement gratuit n'a qu'un site.
#  - HEBERGEUR=firebase : main → le site en ligne ; pull request → un canal
#    de prévisualisation dont l'adresse est postée en commentaire de la PR.

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un seul déploiement à la fois par branche ; on ne coupe pas celui en cours.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le typage casse le build ici plutôt qu'en ligne.
      - run: npx astro check

      - run: npx astro build

      # Le mot de passe ne transite que par l'environnement de cette étape.
      - if: vars.HEBERGEUR == 'ovh' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tools/deploy-sftp.sh
        env:
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}

      # Le secret est créé par `firebase init hosting:github` (cf. README,
      # « Mise en ligne »). Son nom suit l'identifiant du projet Firebase :
      # si le projet s'appelle autrement, changer les deux lignes ensemble.
      - if: vars.HEBERGEUR == 'firebase'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KATREKATRSET }}
          projectId: katrekatrset
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}

      # GitHub Pages sert le site dans un sous-dossier : on reconstruit avec
      # la bonne adresse plutôt que de réutiliser dist/, fait pour la racine.
      - if: (vars.HEBERGEUR == '' || vars.HEBERGEUR == 'pages') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx astro build
        env:
          SITE_URL: https://vbousson.github.io
          SITE_BASE: /site-barbershop

      - if: (vars.HEBERGEUR == '' || vars.HEBERGEUR == 'pages') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: deployer
    if: (vars.HEBERGEUR == '' || vars.HEBERGEUR == 'pages') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
