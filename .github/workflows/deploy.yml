name: Déployer sur Firebase Hosting

# main → le site en ligne (katrekatrset.fr).
# Pull request → un canal de prévisualisation Firebase, dont l'adresse est
# postée en commentaire de la PR et qui expire au bout de 7 jours.
on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un seul déploiement à la fois par branche ; on ne coupe pas celui en cours.
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le typage casse le build ici plutôt qu'en ligne.
      - run: npx astro check

      - run: npx astro build

      # Le secret est créé par `firebase init hosting:github` (cf. README,
      # « Mise en ligne »). Son nom suit l'identifiant du projet Firebase :
      # si le projet s'appelle autrement, changer les deux lignes ensemble.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KATREKATRSET }}
          projectId: katrekatrset
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
